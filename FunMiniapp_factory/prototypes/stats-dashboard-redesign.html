<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统计看板 - FunMini Factory</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --bg: #faf6f1;
      --surface: #ffffff;
      --surface-soft: #faf8f5;
      --ink: #1a1a2e;
      --muted: #8b8b9e;
      --faint: #b4b4c7;
      --border: rgba(0, 0, 0, 0.06);
      --border-strong: rgba(0, 0, 0, 0.07);
      --border-light: rgba(0, 0, 0, 0.04);
      --accent: #c44a1c;
      --accent-strong: #ef5b5b;
      --green-bg: #dcfce7;
      --green-ink: #15803d;
      --rose-bg: #ffe4e6;
      --rose-ink: #be123c;
      --blue-bg: #dbeafe;
      --blue-ink: #1d4ed8;
      --violet-bg: #f3e8ff;
      --violet-ink: #7c3aed;
      --amber-bg: #fef3c7;
      --amber-ink: #b45309;
      --radius-xl: 22px;
      --radius-lg: 18px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --radius-xs: 10px;
      --shadow-sm: 0 1px 3px rgba(15,23,42,0.04);
      --shadow-md: 0 4px 20px rgba(15,23,42,0.06);
      --shadow-lg: 0 12px 40px rgba(15,23,42,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0.01em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== 页面背景光晕 ===== */
    .app-frame {
      min-height: 100vh;
      background:
        radial-gradient(circle at 86% 8%, rgba(255, 183, 135, 0.38), transparent 30%),
        radial-gradient(circle at 12% 55%, rgba(168, 85, 247, 0.10), transparent 28%),
        radial-gradient(circle at 65% 75%, rgba(16, 185, 129, 0.08), transparent 26%),
        linear-gradient(110deg, #faf6f1 0%, #faf6f1 46%, #fbeee3 100%);
      background-attachment: fixed;
    }

    /* ===== 顶部导航 ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background:
        radial-gradient(circle at 86% 220%, rgba(255, 183, 135, 0.22), transparent 42%),
        radial-gradient(circle at 8% 220%, rgba(168, 85, 247, 0.06), transparent 42%),
        linear-gradient(110deg, #faf6f1 0%, #faf6f1 46%, #fbeee3 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 0;
    }
    .topbar-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 36px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff6b6b, #f43f5e);
      box-shadow: 0 12px 24px rgba(244, 63, 94, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .brand-text {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .topbar-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topbar-tab {
      position: relative;
      padding: 6px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.3s;
      border-radius: 8px;
    }
    .topbar-tab:hover { color: var(--ink); background: rgba(0,0,0,0.03); }
    .topbar-tab.active {
      color: var(--ink);
      background: rgba(0,0,0,0.03);
    }
    .topbar-tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 16px;
      right: 16px;
      height: 2px;
      border-radius: 2px;
      background: #ff6b6b;
    }

    /* ===== 主内容 ===== */
    .main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 36px 48px;
    }

    /* ===== 页面头部 ===== */
    .page-header {
      min-height: 104px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
      padding: 22px 28px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      background:
        linear-gradient(118deg, transparent 0%, rgba(255,255,255,0.12) 32%, rgba(196,74,28,0.06) 52%, rgba(239,91,91,0.10) 74%, rgba(255,236,195,0.70) 100%),
        linear-gradient(135deg, #fff 0%, #fffaf4 46%, #fff0dc 100%);
    }
    .page-header h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .page-header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .sync-button {
      height: 40px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 18px;
      border: 0;
      border-radius: var(--radius-xs);
      color: #fff;
      background: var(--ink);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.02em;
      transition: all 0.2s ease;
      cursor: pointer;
      flex-shrink: 0;
    }
    .sync-button:hover:not(:disabled) {
      background: #2a2a3e;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(26, 26, 46, 0.22);
    }
    .sync-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .sync-button .spin { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== Bento 概览 ===== */
    .bento {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .bento-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      overflow: hidden;
      transition: box-shadow 0.2s ease;
    }
    .bento-card:hover { box-shadow: var(--shadow-md); }

    /* 深色大卡片 */
    .hero-card {
      background: #1a1a2e;
      border: none;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100px;
      position: relative;
      overflow: hidden;
    }
    .hero-card::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -30%;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196,74,28,0.15), transparent 70%);
      pointer-events: none;
    }
    .hero-card::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -20%;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,107,107,0.08), transparent 70%);
      pointer-events: none;
    }
    .hero-card .label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      position: relative;
      z-index: 1;
    }
    .hero-card .number {
      font-size: 36px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.04em;
      line-height: 1;
      margin: 6px 0 8px;
      position: relative;
      z-index: 1;
    }
    .hero-card .trend {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 700;
      color: #86efac;
      position: relative;
      z-index: 1;
    }
    .hero-card .meta {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.10);
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.40);
      line-height: 1.6;
      position: relative;
      z-index: 1;
    }

    /* 分类排名卡片 */
    .rank-card {
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
    }
    .rank-card .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .rank-card .card-head h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }
    .rank-card .card-head span {
      font-size: 12px;
      font-weight: 600;
      color: var(--faint);
    }
    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      justify-content: space-between;
    }
    .rank-item {
      display: grid;
      grid-template-columns: 52px 1fr 36px;
      align-items: center;
      gap: 10px;
      padding: 3px 0;
      border-radius: 6px;
      transition: background 0.12s ease;
    }
    .rank-item:hover { background: var(--bg); }
    .rank-item .bar-track {
      height: 8px;
      border-radius: 99px;
      background: var(--border-light);
      overflow: hidden;
    }
    .rank-item .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--accent);
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      min-width: 2px;
    }
    .rank-item .name {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft);
    }
    .rank-item .count {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      text-align: right;
    }

    /* ===== 概览面板区 ===== */
    .overview-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }
    .panel {
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .panel-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }
    .panel-head span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    /* 平台分布（小面板） */
    .plat-summary-list { display: flex; flex-direction: column; gap: 10px; }
    .plat-summary-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .plat-summary-row .plat-icon {
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .plat-summary-row .plat-info { flex: 1; min-width: 0; }
    .plat-summary-row .plat-name { font-size: 12px; font-weight: 600; color: var(--ink-soft); display: flex; justify-content: space-between; }
    .plat-summary-row .plat-name span { color: var(--faint); font-weight: 500; }
    .plat-summary-row .plat-bar-wrap { height: 5px; background: var(--border-light); border-radius: 99px; overflow: hidden; margin-top: 3px; }
    .plat-summary-row .plat-bar { height: 100%; border-radius: 99px; background: var(--ink); transition: width 0.5s ease; }

    /* 平台分布 */
    .plat-summary-list { display: grid; gap: 10px; }
    .plat-summary-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .plat-summary-row .plat-icon {
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .plat-summary-row .plat-info { flex: 1; min-width: 0; }
    .plat-summary-row .plat-name { font-size: 12px; font-weight: 700; color: var(--ink-soft); display: flex; justify-content: space-between; }
    .plat-summary-row .plat-name span { color: var(--faint); font-weight: 600; }
    .plat-summary-row .plat-bar-wrap { height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; margin-top: 3px; }
    .plat-summary-row .plat-bar { height: 100%; border-radius: 99px; background: var(--ink); transition: width 0.5s ease; }

    /* ===== 趋势图区（全宽） ===== */
    .trend-section { margin-bottom: 16px; }
    .echart-panel {
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
    }
    .echart-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 8px;
    }
    .echart-head h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }
    .echart-head span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .echart-head strong {
      color: var(--ink);
      font-size: 22px;
      line-height: 1;
      font-weight: 700;
    }
    .trend-toggle {
      display: flex; gap: 2px; padding: 3px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    }
    .trend-toggle button {
      padding: 5px 14px; border: none; border-radius: 7px; background: transparent;
      color: var(--faint); font-size: 12px; font-weight: 700; cursor: pointer;
      transition: all 0.12s ease;
    }
    .trend-toggle button:hover { color: var(--muted); }
    .trend-toggle button.on { background: var(--ink); color: #fff; }
    .trend-chart-box { width: 100%; height: 340px; }

    /* 分类图例 */
    .trend-legend {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding-top: 12px; margin-top: 4px;
      border-top: 1px solid var(--border);
      opacity: 0; max-height: 0; overflow: hidden;
      transition: all 0.3s ease;
    }
    .trend-legend.show { opacity: 1; max-height: 100px; }
    .legend-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 99px;
      background: var(--bg); border: 1px solid var(--border);
      font-size: 11px; font-weight: 700; color: var(--ink-soft);
      cursor: pointer; transition: all 0.15s ease; user-select: none;
    }
    .legend-pill:hover { background: var(--surface-soft); }
    .legend-pill.inactive { opacity: 0.35; }
    .legend-pill .dot { width: 7px; height: 7px; border-radius: 50%; }

    /* ===== 分类详情 ===== */
    .detail-section { margin-bottom: 16px; }
    .detail-section:last-child { margin-bottom: 0; }
    .section-title {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px;
    }
    .section-title h2 { font-size: 15px; font-weight: 700; color: var(--ink); }
    .section-title .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .section-title .count {
      margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted);
    }

    .cat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }

    .cat-card {
      min-width: 0;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }
    .cat-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    .cat-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: var(--cat-color, var(--accent));
    }
    .cat-card-head {
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--border);
    }
    .cat-card-head .cat-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 4px;
    }
    .cat-card-head .cat-count-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .cat-card-head .cat-count {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ink);
      line-height: 1;
    }
    .cat-card-head .cat-unit {
      font-size: 12px;
      font-weight: 500;
      color: var(--faint);
    }
    .cat-card-head .cat-pct {
      margin-left: auto;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      background: var(--bg);
      padding: 2px 8px;
      border-radius: 6px;
    }
    .cat-card-body {
      padding: 10px 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .plat-row {
      display: grid;
      grid-template-columns: 24px 1fr 38px;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
      border-radius: 5px;
      transition: background 0.12s ease;
    }
    .plat-row:hover { background: var(--bg); }
    .plat-row .plat-icon {
      width: 24px; height: 24px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .plat-row .plat-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .plat-row .plat-name-line {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .plat-row .plat-name-line .plat-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
    }
    .plat-row .plat-bar-wrap {
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .plat-row .plat-bar {
      height: 100%;
      border-radius: 99px;
      transition: width 0.5s ease;
      min-width: 2px;
    }
    .plat-row .plat-pct {
      font-size: 11px;
      font-weight: 600;
      color: var(--faint);
      text-align: right;
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 12px 20px; border-radius: 12px;
      background: var(--ink); color: #fff;
      font-size: 13px; font-weight: 600;
      box-shadow: 0 12px 40px rgba(26, 26, 46, 0.18);
      opacity: 0; transform: translateY(10px);
      transition: all 0.35s ease;
      pointer-events: none; z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ===== 动画 ===== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .page-header, .bento, .overview-row, .trend-section, .detail-section {
      animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .page-header { animation-delay: 0s; }
    .bento { animation-delay: 0.04s; }
    .overview-row { animation-delay: 0.08s; }
    .trend-section { animation-delay: 0.12s; }
    .detail-section { animation-delay: 0.16s; }
    .cat-card {
      opacity: 0;
      animation: fadeUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 1024px) {
      .bento { grid-template-columns: 1fr; }
      .hero-card { min-height: 160px; }
      .overview-row { grid-template-columns: 1fr; }
      .cat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .main { padding: 16px 24px 40px; }
      .topbar-inner { padding: 0 24px; }
    }
    @media (max-width: 640px) {
      .bento, .cat-grid { grid-template-columns: 1fr; }
      .page-header { flex-direction: column; align-items: flex-start; gap: 14px; }
      .main { padding: 12px 16px 40px; }
      .topbar-inner { padding: 0 16px; }
    }
  </style>
</head>
<body>
  <div class="app-frame">
    <!-- 顶部导航 -->
    <nav class="topbar">
      <div class="topbar-inner">
        <a href="#" class="brand">
          <span class="brand-mark">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
              <rect x="2" y="3" width="20" height="14" rx="3"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </span>
          <span class="brand-text">FunMini Factory</span>
        </a>
        <div class="topbar-nav">
          <a href="#" class="topbar-tab">首页</a>
          <a href="#" class="topbar-tab">小程序工厂</a>
          <a href="#" class="topbar-tab active">统计看板</a>
        </div>
      </div>
    </nav>

    <div class="main">
      <!-- 页面头部 -->
      <div class="page-header">
        <div>
          <h1>统计看板</h1>
          <p>按分类、H5 细分、分类内平台结构和新增趋势分析小程序资产</p>
        </div>
        <button class="sync-button" id="refresh-btn">
          <svg id="refresh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          刷新统计
        </button>
      </div>

      <!-- Bento 概览：深色大卡片 + 分类排名 -->
      <div class="bento">
        <div class="bento-card hero-card">
          <div>
            <div class="label">总项目数</div>
            <div class="number" id="hero-number">0</div>
            <div class="trend">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
              较昨日 +3
            </div>
          </div>
          <div class="meta">
            覆盖 8 个分类 · 6 个平台<br>
            最近更新 2 分钟前
          </div>
        </div>

        <div class="bento-card rank-card">
          <div class="card-head">
            <h3>分类分布</h3>
            <span>按项目数量排序</span>
          </div>
          <div class="rank-list" id="rank-list"></div>
        </div>
      </div>

      <!-- 趋势图（全宽） -->
      <div class="trend-section">
        <div class="echart-panel">
          <div class="echart-head">
            <div>
              <h2>最近新增趋势</h2>
              <span>最近 30 天每日新增项目走势</span>
            </div>
            <div class="trend-toggle" id="trend-toggle">
              <button class="on" data-mode="total">总量</button>
              <button data-mode="category">按分类</button>
            </div>
          </div>
          <div id="trend-chart" class="trend-chart-box"></div>
          <div class="trend-legend" id="trend-legend"></div>
        </div>
      </div>

      <!-- 分类详情 -->
      <div class="detail-section">
        <div class="section-title">
          <span class="dot" style="background:#E85D4C;"></span>
          <h2>小程序类</h2>
          <span class="count">4 个分类 · 171 个项目</span>
        </div>
        <div class="cat-grid" id="miniapp-grid"></div>
      </div>

      <div class="detail-section">
        <div class="section-title">
          <span class="dot" style="background:#F59E0B;"></span>
          <h2>H5 页面类</h2>
          <span class="count">4 个分类 · 38 个项目</span>
        </div>
        <div class="cat-grid" id="h5-grid"></div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">数据已更新</div>

  <script>
    // ========== 数据 ==========
    const catData = [
      { name: '影视', key: '影视', count: 58, pct: 27.8, color: '#E85D4C', group: 'miniapp', platforms: { '抖音': 36, '百度': 24, '微信': 15, '快手': 10 } },
      { name: '小说', key: '小说', count: 56, pct: 26.8, color: '#10B981', group: 'miniapp', platforms: { '抖音': 65, '微信': 28, '快手': 12, '百度': 5, '支付宝': 2 } },
      { name: '短剧', key: '短剧', count: 38, pct: 18.2, color: '#3B82F6', group: 'miniapp', platforms: { '抖音': 19, '微信': 19, '快手': 9, '支付宝': 3 } },
      { name: '漫剧', key: '漫剧', count: 19, pct: 9.1, color: '#8B5CF6', group: 'miniapp', platforms: { '抖音': 38, '微信': 12, '快手': 6 } },
      { name: 'H5小说', key: 'H5小说', count: 32, pct: 15.3, color: '#F59E0B', group: 'h5', platforms: { '抖音': 32, '微信': 13, '快手': 8, '百度': 2 } },
      { name: 'H5影视', key: 'H5影视', count: 4, pct: 1.9, color: '#F97316', group: 'h5', platforms: { '抖音': 4 } },
      { name: 'H5分销', key: 'H5分销', count: 1, pct: 0.5, color: '#D97706', group: 'h5', platforms: { '通用': 1 } },
      { name: 'H5拉新', key: 'H5拉新', count: 1, pct: 0.5, color: '#92400E', group: 'h5', platforms: { '通用': 1 } },
    ];

    const platformMeta = {
      '通用': { color: '#9CA3AF', abbr: '通' },
      '百度': { color: '#3B82F6', abbr: '百' },
      '抖音': { color: '#1F2937', abbr: '抖' },
      '快手': { color: '#F97316', abbr: '快' },
      '微信': { color: '#22C55E', abbr: '微' },
      '支付宝': { color: '#1677FF', abbr: '支' },
    };

    const platSummary = [
      { name: '抖音', count: 198, color: '#1F2937', abbr: '抖' },
      { name: '微信', count: 86, color: '#22C55E', abbr: '微' },
      { name: '快手', count: 45, color: '#F97316', abbr: '快' },
      { name: '百度', count: 31, color: '#3B82F6', abbr: '百' },
      { name: '支付宝', count: 5, color: '#1677FF', abbr: '支' },
      { name: '通用', count: 2, color: '#9CA3AF', abbr: '通' },
    ];

    // ========== 数字动画 ==========
    function animateNumber(el, target, duration = 800) {
      const start = performance.now();
      function tick(now) {
        const t = Math.min((now - start) / duration, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        el.textContent = Math.round(ease * target);
        if (t < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }
    animateNumber(document.getElementById('hero-number'), 209);

    // ========== 分类排名 ==========
    const rankList = document.getElementById('rank-list');
    const maxCount = Math.max(...catData.map(c => c.count));
    catData.forEach(cat => {
      const item = document.createElement('div');
      item.className = 'rank-item';
      item.innerHTML = `
        <span class="name">${cat.name}</span>
        <div class="bar-track"><div class="bar-fill" style="width:0%; background:${cat.color};"></div></div>
        <strong>${cat.count}</strong>
      `;
      rankList.appendChild(item);
      setTimeout(() => { item.querySelector('.bar-fill').style.width = `${(cat.count / maxCount) * 100}%`; }, 200 + catData.indexOf(cat) * 60);
    });

    // ========== 趋势图 ==========
    const trendChart = echarts.init(document.getElementById('trend-chart'));
    const trendLegend = document.getElementById('trend-legend');
    const days = [];
    const baseDate = new Date();
    baseDate.setDate(baseDate.getDate() - 30);
    for (let i = 0; i < 30; i++) {
      const d = new Date(baseDate);
      d.setDate(d.getDate() + i);
      days.push(`${d.getMonth()+1}/${d.getDate()}`);
    }

    const trendCats = [
      { name: '影视', color: '#E85D4C' },
      { name: '小说', color: '#10B981' },
      { name: '短剧', color: '#3B82F6' },
      { name: '漫剧', color: '#8B5CF6' },
      { name: 'H5小说', color: '#F59E0B' },
      { name: 'H5影视', color: '#F97316' },
      { name: 'H5分销', color: '#D97706' },
      { name: 'H5拉新', color: '#92400E' }
    ];

    const catDataMap = {};
    trendCats.forEach(cat => {
      const data = days.map(() => Math.round(Math.random() * 3));
      data[Math.floor(Math.random() * 30)] = Math.round(Math.random() * 15 + 5);
      catDataMap[cat.name] = data;
    });
    const totalData = days.map((_, i) => trendCats.reduce((sum, cat) => sum + catDataMap[cat.name][i], 0));

    function renderLegend() {
      trendLegend.innerHTML = trendCats.map(cat => `
        <div class="legend-pill" data-cat="${cat.name}">
          <span class="dot" style="background:${cat.color}"></span>
          ${cat.name}
        </div>
      `).join('');
      trendLegend.querySelectorAll('.legend-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          const catName = pill.dataset.cat;
          const isInactive = pill.classList.contains('inactive');
          if (isInactive) {
            pill.classList.remove('inactive');
          } else {
            const allInactive = Array.from(trendLegend.querySelectorAll('.legend-pill')).every(p => p.classList.contains('inactive') || p === pill);
            if (allInactive) {
              trendLegend.querySelectorAll('.legend-pill').forEach(p => p.classList.remove('inactive'));
            } else {
              trendLegend.querySelectorAll('.legend-pill').forEach(p => {
                if (p.dataset.cat !== catName) p.classList.add('inactive');
                else p.classList.remove('inactive');
              });
            }
          }
          const activeCats = Array.from(trendLegend.querySelectorAll('.legend-pill:not(.inactive)')).map(p => p.dataset.cat);
          const filteredSeries = trendCats
            .filter(cat => activeCats.includes(cat.name))
            .map(cat => ({
              name: cat.name, type: 'line', smooth: 0.35, symbol: 'none',
              lineStyle: { width: 2.5, color: cat.color },
              itemStyle: { color: cat.color },
              emphasis: { focus: 'series' },
              data: catDataMap[cat.name]
            }));
          trendChart.setOption({ series: filteredSeries }, { notMerge: true });
        });
      });
    }
    renderLegend();

    function buildTrendOption(mode) {
      let series = [];
      if (mode === 'total') {
        series = [{
          name: '新增总量', type: 'line', smooth: 0.35, symbol: 'none',
          lineStyle: { width: 3, color: '#c44a1c' }, itemStyle: { color: '#c44a1c' },
          areaStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: 'rgba(196,74,28,0.14)' }, { offset: 1, color: 'rgba(196,74,28,0)' }
            ])
          },
          data: totalData
        }];
      } else {
        series = trendCats.map(cat => ({
          name: cat.name, type: 'line', smooth: 0.35, symbol: 'none',
          lineStyle: { width: 2.5, color: cat.color },
          itemStyle: { color: cat.color },
          emphasis: { focus: 'series' },
          data: catDataMap[cat.name]
        }));
      }
      return {
        color: mode === 'total' ? ['#c44a1c'] : trendCats.map(c => c.color),
        tooltip: {
          trigger: 'axis',
          backgroundColor: 'rgba(255,255,255,0.96)', borderColor: 'rgba(0,0,0,0.06)', borderWidth: 1,
          textStyle: { color: '#1a1a2e', fontSize: 13, fontWeight: 600 },
          padding: [12, 16],
          extraCssText: 'box-shadow: 0 8px 30px rgba(0,0,0,0.08); border-radius: 12px;',
          formatter: function(params) {
            let html = `<div style="font-weight:900;margin-bottom:8px;font-size:14px;">${params[0].axisValue}</div>`;
            params.forEach(p => {
              html += `<div style="display:flex;align-items:center;gap:8px;margin:4px 0;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${p.color};"></span><span style="flex:1;font-size:12px;color:#8b8b9e;">${p.seriesName}</span><span style="font-weight:900;font-size:13px;">${p.value}</span></div>`;
            });
            return html;
          }
        },
        legend: { show: false },
        grid: { top: 16, left: 16, right: 16, bottom: 8, containLabel: true },
        xAxis: {
          type: 'category', boundaryGap: false, data: days,
          axisLabel: { color: '#cbd5e1', fontWeight: 500, fontSize: 11, interval: 4 },
          axisTick: { show: false }, axisLine: { lineStyle: { color: '#f1f5f9' } }
        },
        yAxis: {
          type: 'value', minInterval: 1,
          axisLabel: { color: '#cbd5e1', fontWeight: 500, fontSize: 11 },
          splitLine: { lineStyle: { color: '#f1f5f9' } }
        },
        series
      };
    }

    let trendMode = 'total';
    trendChart.setOption(buildTrendOption('total'));
    trendLegend.classList.remove('show');
    setTimeout(() => trendChart.resize(), 100);

    document.querySelectorAll('#trend-toggle button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#trend-toggle button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        trendMode = btn.dataset.mode;
        trendChart.setOption(buildTrendOption(trendMode), { notMerge: true });
        if (trendMode === 'category') {
          trendLegend.classList.add('show');
          trendLegend.querySelectorAll('.legend-pill').forEach(p => p.classList.remove('inactive'));
        } else {
          trendLegend.classList.remove('show');
        }
      });
    });

    // ========== 分类详情卡片 ==========
    function renderCatCard(cat, index) {
      const platEntries = Object.entries(cat.platforms).sort((a, b) => b[1] - a[1]);
      const maxPlat = platEntries[0]?.[1] || 1;
      const platRows = platEntries.map(([platName, platCount]) => {
        const meta = platformMeta[platName] || { color: '#9CA3AF', abbr: platName[0] };
        const pct = Math.round((platCount / cat.count) * 100);
        return `
          <div class="plat-row">
            <div class="plat-icon" style="background:${meta.color}">${meta.abbr}</div>
            <div class="plat-info">
              <div class="plat-name-line">
                <span>${platName}</span>
                <span class="plat-count">${platCount}</span>
              </div>
              <div class="plat-bar-wrap">
                <div class="plat-bar" style="width:0%; background:${meta.color}35;" data-width="${(platCount / maxPlat) * 100}%"></div>
              </div>
            </div>
            <div class="plat-pct">${pct}%</div>
          </div>
        `;
      }).join('');

      return `
        <div class="cat-card" style="--cat-color:${cat.color}; animation-delay: ${index * 0.05}s;">
          <div class="cat-card-head">
            <div class="cat-name">${cat.name}</div>
            <div class="cat-count-row">
              <span class="cat-count">${cat.count}</span>
              <span class="cat-unit">个项目</span>
              <span class="cat-pct">${cat.pct}%</span>
            </div>
          </div>
          <div class="cat-card-body">${platRows}</div>
        </div>
      `;
    }

    const miniappGrid = document.getElementById('miniapp-grid');
    const h5Grid = document.getElementById('h5-grid');
    catData.filter(c => c.group === 'miniapp').forEach((cat, i) => {
      miniappGrid.insertAdjacentHTML('beforeend', renderCatCard(cat, i));
    });
    catData.filter(c => c.group === 'h5').forEach((cat, i) => {
      h5Grid.insertAdjacentHTML('beforeend', renderCatCard(cat, i + 4));
    });

    setTimeout(() => {
      document.querySelectorAll('.plat-bar[data-width]').forEach(bar => { bar.style.width = bar.dataset.width; });
    }, 400);

    // ========== 刷新按钮 ==========
    const refreshBtn = document.getElementById('refresh-btn');
    const refreshIcon = document.getElementById('refresh-icon');
    const toast = document.getElementById('toast');
    refreshBtn.addEventListener('click', () => {
      if (refreshBtn.disabled) return;
      refreshBtn.disabled = true;
      refreshIcon.classList.add('spin');
      setTimeout(() => {
        refreshBtn.disabled = false;
        refreshIcon.classList.remove('spin');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }, 1000);
    });

    window.addEventListener('resize', () => trendChart.resize());
  </script>
</body>
</html>
